<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- HopContent topic icon: graph walk with highlighted current node visit + time hint, BITPlan Meeting context -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#2b6cb0"/>
  <rect x="5" y="5" width="54" height="54" rx="9" fill="#ebf8ff"/>
  <!-- walk edges -->
  <polyline points="14,44 24,20 40,34 50,16" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- visited nodes -->
  <circle cx="14" cy="44" r="5" fill="#2b6cb0"/>
  <circle cx="24" cy="20" r="5" fill="#2b6cb0"/>
  <circle cx="50" cy="16" r="5" fill="#2b6cb0"/>
  <!-- current node (the hop being documented) -->
  <circle cx="40" cy="34" r="8" fill="none" stroke="#c53030" stroke-width="3"/>
  <circle cx="40" cy="34" r="4" fill="#e53e3e"/>
  <!-- time hint: MM:SS clock -->
  <circle cx="47" cy="50" r="7" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <line x1="47" y1="50" x2="47" y2="45.5" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="50" x2="50.5" y2="50" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/>
</svg>
