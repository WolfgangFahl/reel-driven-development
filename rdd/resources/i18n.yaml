    reviewing: Begutachten
    reviewing_text: Eine Begutachtung hat ihre eigene Adresse. Wer zur Begutachtung
      eingeladen ist, folgt dem per Mail erhaltenen Link - er öffnet die Reels
      der Begutachtung. Es gibt kein Konto und kein Passwort, und der Link gilt
      weiter, wenn Reels hinzukommen.
    browsing: Stöbern
    browsing_text: Die öffentlichen Reels dieser Website stehen unter <a href="/reels">reels</a>.
    demo: Demo
    demo_text: Ein Reel selbst ansehen
