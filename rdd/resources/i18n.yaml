# i18n texts of a reel site - de and en for a start
# texts: the site pages; review: the packaged review page
# per the i18n issue the browser setting is the default,
# ?lang= decides and the cookie remembers
languages:
- en
- de
flags:
  en: 🇬🇧
  de: 🇩🇪
texts:
  en:
    home: home
    reels: reels
    github: github
    help: help
    about: about
    intro: This site keeps the reels of recorded sessions - a video, the document
      derived from it and the evidence frames.
    reviewing: Reviewing
    reviewing_text: A review is addressed by its own url. If you were invited
      to review, follow the link you received by mail - it opens the reels of
      your review. There is no account and no password, and the link keeps working
      when reels are added.
    browsing: Browsing
    browsing_text: The reels this site makes public are listed under <a href="/reels">reels</a>.
    demo: Demo
    demo_text: See a reel for yourself
    demo_hint: inspect it in true inspection mode; your verdicts stay on your
      device.
    rdd_text: The reels are produced with
    rdd_text2: free software under Apache-2.0, so any organization can run a site
      like this one.
    review: review
    summary: summary
    file: file
    bytes: bytes
    review_by: Reels - review by {person}
    no_reels: This site makes no reel public yet.
    reel: reel
    title: title
